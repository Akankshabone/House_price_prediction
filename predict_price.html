<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right,#a18cd1,#fbc2eb);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:500px;
            padding:30px;
            border-radius:15px;
        }
    </style>
</head>
<body>

<div class="card shadow">
    <h2 class="text-center mb-4">🏡 House Price Prediction</h2>

    <form action="/predict" method="POST">

        <div class="mb-3">
            <label>Size (sq ft)</label>
            <input type="number" step="any" name="size" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Bedrooms</label>
            <input type="number" step="any" name="bedrooms" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Bathrooms</label>
            <input type="number" step="any" name="bathrooms" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Age of House</label>
            <input type="number" step="any" name="age" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Distance to City Center</label>
            <input type="number" step="any" name="distance" class="form-control" required>
        </div>

        <button class="btn btn-primary w-100">
            Predict Price
        </button>

    </form>
</div>

</body>
</html>
